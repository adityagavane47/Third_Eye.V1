[package]
name    = "thirdeye-zkml-aggregator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thirdeye-zkml-aggregator"
path = "src/main.rs"

[dependencies]
# SP1 guest runtime with the `verify` feature enabled — required for
# recursive proof verification inside the zkVM.
sp1-zkvm = { version = "3.0.0", features = ["verify"] }

serde      = { workspace = true }
serde_json = { workspace = true }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
